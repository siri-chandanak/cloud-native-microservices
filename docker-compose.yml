services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservicesdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    build:
      context: ./UserService
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=microservicesdb;Username=postgres;Password=postgres

  order-service:
    build:
      context: ./OrderService
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=microservicesdb;Username=postgres;Password=postgres

  notification-service:
    build:
      context: ./NotificationService
    ports:
      - "5003:8080"

volumes:
  postgres_data: